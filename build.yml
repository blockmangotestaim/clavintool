name: Build ClavinTool APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # If you uploaded the project as a single zip (easiest on a phone), unpack it first.
      - name: Unpack clavintool.zip if present
        run: |
          if [ -f clavintool.zip ]; then
            unzip -o clavintool.zip -d _src
            cp -r _src/clavintool/. .
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Make sure NDK + CMake are installed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" || true

      - name: Build APK with native Lua 5.3
        id: native
        continue-on-error: true
        run: gradle assembleDebug --no-daemon --stacktrace -PwithNative=true

      - name: Fallback build (Lua 5.2 only) if the native build failed
        if: steps.native.outcome == 'failure'
        run: |
          echo "::warning::Native Lua 5.3 build FAILED - building a fallback APK with the Lua 5.2 engine. Open the 'Build APK with native Lua 5.3' step and send me the error."
          gradle assembleDebug --no-daemon --stacktrace -PwithNative=false

      - uses: actions/upload-artifact@v4
        with:
          name: ClavinTool-debug-apk
          path: app/build/outputs/apk/debug/*.apk
